<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVALON 3D & Model - Store & Slicer</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- 1. ดึงไฟล์ CSS แยก -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Structure HTML ตามเดิม -->
    <header>...</header>
    <main id="tab-store">...</main>
    <main id="tab-slicer">...</main>

    <!-- Modal สำหรับชำระเงิน -->
    <div id="checkout-modal" class="modal">...</div>

    <!-- Modal เพิ่มเติม: สำหรับดูรายละเอียดสินค้า (Product Detail Modal) -->
    <div id="product-detail-modal" class="modal">
        <div class="modal-card" style="text-align: left; max-width: 550px;">
            <span class="close-modal" onclick="closeProductDetail()">&times;</span>
            <img id="detail-img" src="" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
            <h2 id="detail-title" style="margin: 0 0 10px 0; color: var(--primary);"></h2>
            <div id="detail-price" style="font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-bottom: 15px;"></div>
            <p id="detail-desc" style="line-height: 1.6; color: var(--text-main); font-size: 0.95rem; white-space: pre-line;"></p>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="buy-btn" id="detail-buy-btn" style="flex: 1;">🛒 สั่งซื้อสินค้าชิ้นนี้</button>
            </div>
        </div>
    </div>

    <!-- 2. ดึงไฟล์ JS แยก (เรียงลำดับการโหลดไฟล์) -->
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
